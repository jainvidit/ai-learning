<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Page - Clean Tracking</title>

  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-DEMO123');
  </script>

  <!-- Data Layer - Properly initialized BEFORE push -->
  <script>
    window.dataLayer = window.dataLayer || [];

    // Page view event
    dataLayer.push({
      event: 'page_view',
      page_type: 'product',
      product_id: 'SHOE-5678'
    });
  </script>
</head>
<body>
  <h1>Running Shoes Pro</h1>
  <p>High-performance running shoes for athletes.</p>
  <p>Price: $129.99</p>
  <button id="addToCart">Add to Cart</button>

  <script>
    // Add to cart tracking
    document.getElementById('addToCart').addEventListener('click', function() {
      dataLayer.push({
        event: 'add_to_cart',
        product_id: 'SHOE-5678',
        product_name: 'Running Shoes Pro',
        price: 129.99
      });
    });
  </script>
</body>
</html>
